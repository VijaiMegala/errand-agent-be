<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title desc">
  <title id="title">Home service booking system architecture</title>
  <desc id="desc">Browser to Next.js to Express; Express connects to PostgreSQL and Mastra; Mastra connects to an LLM and authenticated MCP service; MCP connects to PostgreSQL and Express token introspection; PostgreSQL outbox feeds a notification worker through Redis and an API WebSocket endpoint. The agent service sends sanitized live spans through a local LibSQL-backed exporter to LangSmith. A separate local evaluation runner uploads scored synthetic experiments to LangSmith.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1325"/><stop offset="1" stop-color="#101b32"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#1c2a43"/><stop offset="1" stop-color="#162238"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a5b4fc"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker>
    <style>
      text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill:#f8fafc; font-size:37px; font-weight:760; letter-spacing:-.8px; }
      .subtitle { fill:#9eb0ca; font-size:17px; }
      .lane { fill:#7285a8; font-size:14px; font-weight:700; letter-spacing:2.5px; }
      .card { fill:url(#card); stroke:#354760; stroke-width:1.5; rx:19; }
      .nodeTitle { fill:#f8fafc; font-size:23px; font-weight:730; }
      .nodeSub { fill:#a9bbd1; font-size:16px; }
      .pill { fill:#263856; rx:9; }
      .pillText { fill:#a5b4fc; font-size:13px; font-weight:700; }
      .edge { fill:none; stroke:#a5b4fc; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .edgeBoth { fill:none; stroke:#a5b4fc; stroke-width:3; stroke-linecap:round; marker-start:url(#arrow); marker-end:url(#arrow); }
      .event { fill:none; stroke:#5eead4; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowGreen); }
      .eventBoth { fill:none; stroke:#5eead4; stroke-width:3; stroke-linecap:round; marker-start:url(#arrowGreen); marker-end:url(#arrowGreen); }
      .observe { fill:none; stroke:#fbbf24; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowAmber); }
      .optional { stroke-dasharray:9 9; }
      .label { fill:#c9d5ed; font-size:14px; font-weight:600; paint-order:stroke; stroke:#101b32; stroke-width:7px; stroke-linejoin:round; }
      .eventLabel { fill:#82f2df; }
      .observeLabel { fill:#fcd47c; }
      .foot { fill:#8da1bd; font-size:14px; }
    </style>
  </defs>
